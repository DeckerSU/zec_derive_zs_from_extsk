[package]
name = "zec_derive_zs_from_extsk"
version = "0.1.0"
edition = "2021"

[dependencies]
# Protocol primitives and keys (Sapling, ZIP-32)
zcash_primitives = "0.14"          # or current version
# Key/address encoding/decoding utilities (bech32 "zs...", key strings)
zcash_client_backend = "0.11"       # or current version
# Hex encoding for byte arrays
hex = "0.4"
# Base58 encoding/decoding
bs58 = "0.5"
# Prime field trait for jubjub::Fr
ff = "0.13"
